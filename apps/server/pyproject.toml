[project]
name = "collab-workspace-server"
version = "0.1.0"
description = "Backend for Collab Workspace"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100
include = ["*.py", "*.pyi"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (сортировка импортов)
    "N",      # pep8-naming
    "UP",     # pyupgrade (обновление синтаксиса)
    "B",      # flake8-bugbear (поиск багов)
    "SIM",    # flake8-simplify (упрощение кода)
    "TCH",    # flake8-type-checking (проверка типов)
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (управляется line-length)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "RUF001", # отключаем проверку на неоднозначные unicode-символы в строках
    "RUF002", # отключаем проверку на неоднозначные unicode-символы в докстрингах
    "RUF003", # отключаем проверку на неоднозначные unicode-символы в комментариях
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_decorators = false
disable_error_code = ["redundant-cast"]

# Исключения для конкретных файлов
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Исключения для SQLAlchemy и Pydantic
[[tool.mypy.overrides]]
module = ["sqlalchemy.*", "pydantic.*", "pydantic_settings.*"]
follow_imports = "skip"

# Полностью отключаем проверку типов для Alembic (автогенерируемый код)
[[tool.mypy.overrides]]
module = ["alembic.*", "alembic"]
ignore_errors = true

# Игнорируем ошибки импорта для redis
[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true
